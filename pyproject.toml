[project]
name = "pitchly"
version = "0.1.1"
description = "Low latency real-time audio quality detection and analysis library"
readme = "README.md"
license = "MIT"
keywords = ["audio", "real-time", "quality-detection", "low-latency", "noise-detection", "signal-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
authors = [
    { name = "Henrique", email = "henriquemoreira10fk@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aubio",
    "librosa",
    "numpy",
    "pydantic>=2.0.0",
    "scipy",
    "sounddevice",
]

[dependency-groups]
dev = [
    "rich",
]
lint = [
    "ruff",
]

[tool.uv.sources]
aubio = { git = "https://github.com/aubio/aubio.git", rev = "master" }

[project.scripts]
pitchly = "pitchly.cli.__main__:app"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
