[project]
name = "pitchly"
version = "0.1.1"
description = "Low latency real-time audio quality detection and analysis library"
readme = "README.md"
license = "MIT"
keywords = ["audio", "real-time", "quality-detection", "low-latency", "noise-detection", "signal-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
authors = [
    { name = "Henrique", email = "henriquemoreira10fk@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "aubio",
    "blessed>=1.23.0",
    "librosa>=0.11.0",
    "numba>=0.62.1",
    "numpy>=2.3.4",
    "pydantic>=2.12.4",
    "scipy>=1.16.3",
    "sounddevice>=0.5.3",
]

[dependency-groups]
dev = [
    "rich>=14.2.0",
]
lint = [
    "ruff>=0.14.4",
]

[tool.uv.sources]
aubio = { git = "https://github.com/aubio/aubio.git", branch = "master" }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
